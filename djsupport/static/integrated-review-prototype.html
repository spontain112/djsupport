<!DOCTYPE html>
<!--
classification: concept
PROTOTYPE — throwaway, read-only, and never production authority.
Question: Which integrated review surface best supports evidence, listening,
one human decision, and automatic progression?
Three variants on the DJ Support review surface, switchable via ?variant=A|B|C.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Support — Integrated Review Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --bg: #111111;
            --surface: #18181b;
            --surface-raised: #202024;
            --border: #303036;
            --border-strong: #47474f;
            --accent: #c4f82a;
            --accent-soft: rgba(196, 248, 42, .12);
            --text: #e8e4de;
            --muted: #a1a1aa;
            --dim: #71717a;
            --warn: #fbbf24;
            --error: #f87171;
            --info: #7dd3fc;
            --shadow: 0 24px 70px rgba(0,0,0,.42);
        }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "IBM Plex Mono", monospace;
        }
        button, a { font: inherit; }
        button { color: inherit; }
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        .shell { min-height: 100vh; padding-bottom: 112px; }
        .topbar {
            height: 68px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(17,17,17,.93);
            backdrop-filter: blur(18px);
        }
        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
            font: 800 18px/1 Inter, sans-serif;
            letter-spacing: 2px;
        }
        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--accent);
            color: #111;
            letter-spacing: -1px;
            font-size: 13px;
        }
        .top-meta { display: flex; align-items: center; gap: 22px; }
        .privacy, .progress-text {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }
        .privacy::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 8px;
        }
        .progress-rail { height: 3px; background: var(--border); }
        .progress-fill { height: 100%; background: var(--accent); transition: width .25s ease; }
        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10px;
            font-weight: 700;
        }
        h1, h2, h3, p { margin-top: 0; }
        h1, h2, h3 { font-family: Inter, sans-serif; }
        h1 { font-size: clamp(28px, 4vw, 48px); line-height: 1.03; margin-bottom: 10px; }
        h2 { font-size: 22px; line-height: 1.15; margin-bottom: 8px; }
        h3 { font-size: 13px; letter-spacing: .3px; margin-bottom: 8px; }
        .subtle { color: var(--muted); font-size: 12px; line-height: 1.65; }
        .tiny { color: var(--dim); font-size: 10px; line-height: 1.55; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 7px 10px;
            color: var(--muted);
            font-size: 10px;
        }
        .pill--accent { border-color: rgba(196,248,42,.45); color: var(--accent); background: var(--accent-soft); }
        .pill--warn { border-color: rgba(251,191,36,.45); color: var(--warn); }
        .divider { height: 1px; background: var(--border); }
        .facts { display: grid; gap: 10px; }
        .fact {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }
        .fact:last-child { border-bottom: 0; padding-bottom: 0; }
        .fact span:first-child { color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        .fact strong { text-align: right; font-weight: 500; }
        .evidence {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .evidence-item { padding: 14px; border-right: 1px solid var(--border); }
        .evidence-item:last-child { border-right: 0; }
        .evidence-label { display: block; color: var(--dim); font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; }
        .evidence-value { font-size: 12px; }
        .evidence-value--good { color: var(--accent); }
        .spotify-frame {
            width: 100%;
            height: 152px;
            border: 0;
            border-radius: 12px;
            display: block;
            background: #222;
        }
        .open-link {
            color: var(--muted);
            font-size: 10px;
            text-decoration: none;
            border-bottom: 1px solid var(--border-strong);
        }
        .open-link:hover { color: var(--accent); border-color: var(--accent); }
        .decision-set { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; }
        .decision {
            min-height: 48px;
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            font-size: 10px;
            letter-spacing: .5px;
            transition: border-color .16s, background .16s, transform .16s;
        }
        .decision:hover { border-color: var(--muted); transform: translateY(-1px); }
        .decision--primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
        .decision--challenge { border-color: rgba(248,113,113,.5); color: #fca5a5; }
        .challenge {
            border-left: 2px solid var(--warn);
            background: rgba(251,191,36,.06);
            padding: 14px 16px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
        }
        .challenge button {
            border: 0;
            background: none;
            padding: 0;
            color: var(--warn);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .state-inspector {
            position: fixed;
            right: 18px;
            bottom: 88px;
            width: min(320px, calc(100vw - 36px));
            background: rgba(24,24,27,.96);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            z-index: 30;
            font-size: 9px;
            color: var(--dim);
            line-height: 1.5;
        }
        .state-inspector strong { color: var(--text); font-weight: 500; }
        .variant-switcher {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 42px minmax(210px,auto) 42px;
            align-items: center;
            background: #f4f4f5;
            color: #18181b;
            border: 1px solid white;
            border-radius: 999px;
            box-shadow: 0 18px 55px rgba(0,0,0,.45);
            overflow: hidden;
            z-index: 40;
        }
        .variant-switcher button { border: 0; background: transparent; height: 42px; cursor: pointer; font-size: 18px; color: #18181b; }
        .variant-switcher button:hover { background: #e4e4e7; }
        .variant-label { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .5px; }

        /* Variant A — focused listening deck */
        .focus {
            width: min(760px, calc(100% - 36px));
            margin: 0 auto;
            padding: 48px 0 24px;
        }
        .focus-head { text-align: center; margin-bottom: 30px; }
        .focus-head .eyebrow { margin-bottom: 12px; }
        .focus-card { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
        .focus-source { padding: 22px 24px; display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--border); }
        .focus-source h2 { margin: 4px 0 0; }
        .focus-source-meta { text-align: right; color: var(--muted); font-size: 10px; line-height: 1.7; }
        .focus-body { padding: 24px; display: grid; gap: 18px; }
        .focus-proposal-head { display: flex; justify-content: space-between; align-items: start; gap: 18px; }
        .focus-decide { border-top: 1px solid var(--border); padding: 18px 24px 22px; background: #151518; }
        .focus-decide .eyebrow { margin-bottom: 12px; }

        /* Variant B — comparison canvas */
        .compare { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 30px; }
        .compare-title { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; gap: 20px; }
        .compare-grid { display: grid; grid-template-columns: minmax(0,.8fr) 44px minmax(0,1.2fr); align-items: stretch; }
        .compare-panel { border: 1px solid var(--border); background: var(--surface); padding: 24px; }
        .compare-panel--source { border-radius: 14px 0 0 14px; }
        .compare-panel--proposal { border-radius: 0 14px 14px 0; }
        .compare-bridge { display: grid; place-items: center; background: var(--accent-soft); border-top: 1px solid rgba(196,248,42,.25); border-bottom: 1px solid rgba(196,248,42,.25); color: var(--accent); font-size: 20px; }
        .compare-panel h2 { margin-top: 18px; }
        .compare-evidence { margin-top: 20px; display: grid; gap: 10px; }
        .compare-actions { margin-top: 18px; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; }
        .compare-actions > div { padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
        .compare-actions .decision-set { grid-template-columns: repeat(2,minmax(0,1fr)); }

        /* Variant C — queue cockpit */
        .cockpit { display: grid; grid-template-columns: 230px minmax(0,1fr) 310px; min-height: calc(100vh - 71px); }
        .queue { border-right: 1px solid var(--border); padding: 22px 14px; background: #141416; }
        .queue h3 { padding: 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-size: 10px; }
        .queue-list { display: grid; gap: 4px; margin-top: 14px; }
        .queue-item { width: 100%; border: 1px solid transparent; border-radius: 7px; background: transparent; padding: 10px; text-align: left; cursor: pointer; }
        .queue-item:hover { background: var(--surface); }
        .queue-item--active { background: var(--surface); border-color: var(--border-strong); }
        .queue-item--done .queue-index { color: var(--accent); }
        .queue-index { float: left; width: 28px; color: var(--dim); font-size: 10px; }
        .queue-copy { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 10px; }
        .queue-status { display: block; margin: 4px 0 0 28px; color: var(--dim); font-size: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .cockpit-main { padding: 30px; overflow: auto; }
        .cockpit-main-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .cockpit-main-head h1 { font-size: 32px; }
        .cockpit-player { padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
        .cockpit-source { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
        .cockpit-source > div { background: var(--surface); padding: 13px; }
        .cockpit-side { border-left: 1px solid var(--border); padding: 24px 20px; background: #141416; }
        .cockpit-side .decision-set { grid-template-columns: 1fr; }
        .cockpit-side .challenge { margin-top: 18px; }
        .side-section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }

        .complete { max-width: 680px; margin: 0 auto; padding: 80px 24px; text-align: center; }
        .complete-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 28px 0; }
        .complete-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 8px; }
        .complete-stat strong { display: block; color: var(--accent); font: 800 26px Inter,sans-serif; }
        .complete-stat span { display: block; margin-top: 5px; color: var(--dim); font-size: 9px; text-transform: uppercase; }
        .restart { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 12px 18px; border-radius: 7px; cursor: pointer; }

        @media (max-width: 1180px) {
            .cockpit { grid-template-columns: 190px minmax(0,1fr); }
            .cockpit-main { padding: 26px 24px 18px; }
            .cockpit-side {
                grid-column: 2;
                border-left: 0;
                padding: 0 24px 30px;
                display: grid;
                grid-template-columns: minmax(160px,.5fr) minmax(0,1.5fr);
                gap: 14px 18px;
                align-items: start;
                background: var(--bg);
            }
            .cockpit-side .side-section { margin: 0; padding: 16px 0 0; border: 0; }
            .cockpit-side .decision-set { grid-template-columns: repeat(2,minmax(0,1fr)); }
            .cockpit-side .challenge { grid-column: 2; margin-top: 0; }
            .cockpit-side > p { grid-column: 2; margin-top: 0 !important; }
            .state-inspector { display: none; }
        }
        @media (max-width: 900px) {
            .compare-grid { grid-template-columns: 1fr; gap: 8px; }
            .compare-panel--source, .compare-panel--proposal { border-radius: 12px; }
            .compare-bridge { display: none; }
            .compare-actions { grid-template-columns: 1fr; }
        }
        @media (max-width: 760px) {
            .cockpit { display: block; }
            .queue {
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 10px 12px;
                overflow-x: auto;
                scrollbar-width: thin;
            }
            .queue h3 { display: none; }
            .queue-list { display: flex; gap: 6px; margin: 0; width: max-content; }
            .queue-item { width: 190px; flex: 0 0 190px; }
            .cockpit-side {
                display: block;
                padding: 0 18px 30px;
            }
            .cockpit-side .side-section { padding-top: 18px; margin-bottom: 14px; }
            .cockpit-side .decision-set { grid-template-columns: 1fr 1fr; }
            .cockpit-side .challenge { margin-top: 14px; }
        }
        @media (max-width: 640px) {
            .topbar { padding: 0 16px; }
            .privacy { display: none; }
            .decision-set { grid-template-columns: 1fr 1fr; }
            .focus-source { display: block; }
            .focus-source-meta { text-align: left; margin-top: 12px; }
            .evidence { grid-template-columns: 1fr; }
            .evidence-item { border-right: 0; border-bottom: 1px solid var(--border); }
            .evidence-item:last-child { border-bottom: 0; }
            .cockpit-main { padding: 22px 16px 12px; }
            .cockpit-main-head { display: block; }
            .cockpit-main-head .pill { margin-top: 8px; }
            .cockpit-main-head h1 { font-size: 27px; }
            .cockpit-source { grid-template-columns: 1fr 1fr; }
            .variant-switcher { grid-template-columns: 40px 180px 40px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">DJ</span>DJSUPPORT</div>
            <div class="top-meta">
                <span class="privacy">Private local review</span>
                <span id="top-progress" class="progress-text"></span>
            </div>
        </header>
        <div class="progress-rail"><div id="progress-fill" class="progress-fill"></div></div>
        <main id="app"></main>
    </div>

    <aside id="state-inspector" class="state-inspector" aria-live="polite"></aside>
    <nav class="variant-switcher" aria-label="Prototype variants">
        <button id="previous-variant" type="button" aria-label="Previous variant">←</button>
        <div id="variant-label" class="variant-label"></div>
        <button id="next-variant" type="button" aria-label="Next variant">→</button>
    </nav>

    <script>
        const reviewCases = /*__REVIEW_CASES__*/null ?? [
            {
                id: "synthetic-1",
                sourceArtist: "Synthetic Signal",
                sourceTitle: "Night Transit",
                sourceDuration: 372,
                sourceRelease: "Afterhours Tools",
                sourceLabel: "Invented Records",
                spotifyArtist: "Synthetic Signal",
                spotifyTitle: "Night Transit",
                spotifyDuration: 370,
                spotifyRelease: "Night Transit",
                spotifyUri: "",
                score: 98,
                version: "Original Mix"
            },
            {
                id: "synthetic-2",
                sourceArtist: "Fictional Artist",
                sourceTitle: "Parallel Lines",
                sourceDuration: 244,
                sourceRelease: "Parallel Lines EP",
                sourceLabel: "Example Audio",
                spotifyArtist: "Fictional Artist",
                spotifyTitle: "Parallel Lines",
                spotifyDuration: 244,
                spotifyRelease: "Parallel Lines",
                spotifyUri: "",
                score: 100,
                version: "No version shown"
            },
            {
                id: "synthetic-3",
                sourceArtist: "Demo Selector",
                sourceTitle: "Long Version",
                sourceDuration: 421,
                sourceRelease: "Club Versions",
                sourceLabel: "Prototype Music",
                spotifyArtist: "Demo Selector",
                spotifyTitle: "Long Version",
                spotifyDuration: 238,
                spotifyRelease: "Radio Versions",
                spotifyUri: "",
                score: 81,
                version: "Possible shorter representation"
            }
        ];

        const variants = [
            { key: "A", name: "Focused listening deck" },
            { key: "B", name: "Comparison canvas" },
            { key: "C", name: "Queue cockpit" }
        ];
        const state = {
            currentIndex: 0,
            decisions: {},
            challengeOpen: false,
            variant: getVariant()
        };

        function getVariant() {
            const requested = new URLSearchParams(location.search).get("variant")?.toUpperCase();
            return variants.some(v => v.key === requested) ? requested : "A";
        }
        function formatDuration(seconds) {
            if (!Number.isFinite(seconds) || seconds <= 0) return "Unknown";
            const mins = Math.floor(seconds / 60);
            return `${mins}:${String(Math.round(seconds % 60)).padStart(2,"0")}`;
        }
        function durationDelta(item) {
            if (!item.sourceDuration || !item.spotifyDuration) return null;
            return Math.abs(item.sourceDuration - item.spotifyDuration);
        }
        function spotifyId(uri) { return uri?.split(":").pop() || ""; }
        function spotifyUrl(uri) { return uri ? `https://open.spotify.com/track/${spotifyId(uri)}` : ""; }
        function player(item) {
            const id = spotifyId(item.spotifyUri);
            if (!id) {
                return `<div class="challenge">Synthetic template: the private generated copy places a Spotify listening embed here.</div>`;
            }
            return `<iframe class="spotify-frame" title="Listen to ${escapeHtml(item.spotifyArtist)} — ${escapeHtml(item.spotifyTitle)}" src="https://open.spotify.com/embed/track/${encodeURIComponent(id)}?utm_source=generator" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
        }
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
        }
        function sourceFacts(item) {
            return `
                <div class="facts">
                    <div class="fact"><span>Duration</span><strong>${formatDuration(item.sourceDuration)}</strong></div>
                    <div class="fact"><span>Release</span><strong>${escapeHtml(item.sourceRelease || "Unknown")}</strong></div>
                    <div class="fact"><span>Label</span><strong>${escapeHtml(item.sourceLabel || "Unknown")}</strong></div>
                    <div class="fact"><span>Version</span><strong>${escapeHtml(item.version || "None shown")}</strong></div>
                </div>`;
        }
        function evidence(item) {
            const delta = durationDelta(item);
            const durationCopy = delta === null ? "Unknown" : `${delta}s`;
            const releaseAgrees = item.sourceRelease && item.spotifyRelease && item.sourceRelease.toLowerCase() === item.spotifyRelease.toLowerCase();
            return `<div class="evidence">
                <div class="evidence-item"><span class="evidence-label">Artist + title</span><span class="evidence-value evidence-value--good">Agree</span></div>
                <div class="evidence-item"><span class="evidence-label">Duration difference</span><span class="evidence-value ${delta !== null && delta <= 2 ? "evidence-value--good" : ""}">${durationCopy}</span></div>
                <div class="evidence-item"><span class="evidence-label">Release context</span><span class="evidence-value">${releaseAgrees ? "Same release" : "Different container"}</span></div>
            </div>`;
        }
        function decisions() {
            return `<div class="decision-set">
                <button class="decision decision--primary" data-decision="correct">Correct recording</button>
                <button class="decision decision--challenge" data-decision="wrong">Wrong version / edit</button>
                <button class="decision" data-decision="cannot_verify">Cannot verify</button>
                <button class="decision" data-decision="not_intended">Not my source</button>
            </div>`;
        }
        function challenge() {
            return `<div class="challenge">Need another candidate? <button type="button" data-challenge>Request bounded Correction Search</button>. Nothing is searched or written in this prototype.</div>`;
        }
        function proposalTitle(item) {
            return `<div><div class="eyebrow">Spotify proposal · score ${Number(item.score).toFixed(0)}</div><h2>${escapeHtml(item.spotifyArtist)} — ${escapeHtml(item.spotifyTitle)}</h2><span class="pill ${durationDelta(item) !== null && durationDelta(item) <= 2 ? "pill--accent" : "pill--warn"}">${formatDuration(item.spotifyDuration)} · ${escapeHtml(item.spotifyRelease || "Unknown release")}</span></div>`;
        }
        function sourceTitle(item) {
            return `<div><div class="eyebrow">Source evidence</div><h2>${escapeHtml(item.sourceArtist)} — ${escapeHtml(item.sourceTitle)}</h2></div>`;
        }
        function variantA(item) {
            return `<section class="focus">
                <div class="focus-head"><div class="eyebrow">Review one recording</div><h1>Listen. Compare. Decide.</h1><p class="subtle">Everything needed for one human decision, then automatic progression.</p></div>
                <article class="focus-card">
                    <div class="focus-source">${sourceTitle(item)}<div class="focus-source-meta">${formatDuration(item.sourceDuration)}<br>${escapeHtml(item.sourceRelease || "Unknown release")}<br>${escapeHtml(item.sourceLabel || "Unknown label")}</div></div>
                    <div class="focus-body">
                        <div class="focus-proposal-head">${proposalTitle(item)}${item.spotifyUri ? `<a class="open-link" target="_blank" rel="noreferrer" href="${spotifyUrl(item.spotifyUri)}">Open in Spotify ↗</a>` : ""}</div>
                        ${player(item)}
                        ${evidence(item)}
                        ${challenge()}
                    </div>
                    <div class="focus-decide"><div class="eyebrow">Your decision</div>${decisions()}</div>
                </article>
            </section>`;
        }
        function variantB(item) {
            return `<section class="compare">
                <div class="compare-title"><div><div class="eyebrow">Side-by-side review</div><h1>Compare the evidence</h1></div><p class="subtle">Source on the left. Spotify on the right.<br>Listening remains the final human check.</p></div>
                <div class="compare-grid">
                    <article class="compare-panel compare-panel--source">${sourceTitle(item)}<span class="pill">Beatport evidence</span><h2>${escapeHtml(item.sourceArtist)}<br>${escapeHtml(item.sourceTitle)}</h2>${sourceFacts(item)}</article>
                    <div class="compare-bridge" aria-hidden="true">↔</div>
                    <article class="compare-panel compare-panel--proposal">${proposalTitle(item)}<div style="margin-top:18px">${player(item)}</div>${item.spotifyUri ? `<p style="margin:12px 0 0"><a class="open-link" target="_blank" rel="noreferrer" href="${spotifyUrl(item.spotifyUri)}">Open full track in Spotify ↗</a></p>` : ""}</article>
                </div>
                <div class="compare-evidence">${evidence(item)}</div>
                <div class="compare-actions"><div><div class="eyebrow" style="margin-bottom:12px">One decision</div>${decisions()}</div><div>${challenge()}</div></div>
            </section>`;
        }
        function variantC(item) {
            return `<section class="cockpit">
                <aside class="queue"><h3>Review queue</h3><div class="queue-list">${reviewCases.map((entry,index) => `<button class="queue-item ${index === state.currentIndex ? "queue-item--active" : ""} ${state.decisions[entry.id] ? "queue-item--done" : ""}" data-case-index="${index}"><span class="queue-index">${state.decisions[entry.id] ? "✓" : String(index+1).padStart(2,"0")}</span><span class="queue-copy">${escapeHtml(entry.sourceArtist)} — ${escapeHtml(entry.sourceTitle)}</span><span class="queue-status">${state.decisions[entry.id]?.replaceAll("_"," ") || "pending"}</span></button>`).join("")}</div></aside>
                <div class="cockpit-main">
                    <div class="cockpit-main-head"><div><div class="eyebrow">Evidence workspace</div><h1>${escapeHtml(item.sourceArtist)} — ${escapeHtml(item.sourceTitle)}</h1></div><span class="pill">Case ${state.currentIndex+1} / ${reviewCases.length}</span></div>
                    <div class="cockpit-source">
                        <div><span class="evidence-label">Source duration</span>${formatDuration(item.sourceDuration)}</div>
                        <div><span class="evidence-label">Source release</span>${escapeHtml(item.sourceRelease || "Unknown")}</div>
                        <div><span class="evidence-label">Label</span>${escapeHtml(item.sourceLabel || "Unknown")}</div>
                        <div><span class="evidence-label">Version</span>${escapeHtml(item.version || "None shown")}</div>
                    </div>
                    <article class="cockpit-player">${proposalTitle(item)}<div style="margin-top:16px">${player(item)}</div><div style="margin-top:16px">${evidence(item)}</div></article>
                </div>
                <aside class="cockpit-side"><div class="side-section"><div class="eyebrow">Decision</div><h3 style="margin-top:10px">Is this the intended recording?</h3><p class="tiny">No choice writes matching or playlist state.</p></div>${decisions()}${challenge()}${item.spotifyUri ? `<p style="margin-top:18px"><a class="open-link" target="_blank" rel="noreferrer" href="${spotifyUrl(item.spotifyUri)}">Open in Spotify ↗</a></p>` : ""}</aside>
            </section>`;
        }
        function completeView() {
            const counts = Object.values(state.decisions).reduce((acc,value) => { acc[value] = (acc[value] || 0) + 1; return acc; },{});
            return `<section class="complete"><div class="eyebrow">Prototype review complete</div><h1>One pass. No hidden writes.</h1><p class="subtle">Now compare variants with the arrows below. Which structure made listening and deciding feel most natural?</p><div class="complete-grid"><div class="complete-stat"><strong>${counts.correct || 0}</strong><span>Correct</span></div><div class="complete-stat"><strong>${counts.wrong || 0}</strong><span>Challenged</span></div><div class="complete-stat"><strong>${counts.cannot_verify || 0}</strong><span>Unverified</span></div><div class="complete-stat"><strong>${counts.not_intended || 0}</strong><span>Not source</span></div></div><button class="restart" type="button" data-restart>Restart review</button></section>`;
        }
        function render() {
            const decided = Object.keys(state.decisions).length;
            document.getElementById("top-progress").textContent = `${decided} of ${reviewCases.length} decided`;
            document.getElementById("progress-fill").style.width = `${(decided/reviewCases.length)*100}%`;
            const currentVariant = variants.find(v => v.key === state.variant);
            document.getElementById("variant-label").textContent = `${currentVariant.key} — ${currentVariant.name}`;
            const app = document.getElementById("app");
            if (decided === reviewCases.length) app.innerHTML = completeView();
            else {
                while (state.decisions[reviewCases[state.currentIndex]?.id] && state.currentIndex < reviewCases.length - 1) state.currentIndex += 1;
                const item = reviewCases[state.currentIndex];
                app.innerHTML = state.variant === "A" ? variantA(item) : state.variant === "B" ? variantB(item) : variantC(item);
            }
            document.getElementById("state-inspector").innerHTML = `<strong>PROTOTYPE STATE</strong><br>variant=${state.variant} · current=${Math.min(state.currentIndex+1,reviewCases.length)}/${reviewCases.length}<br>decisions=${JSON.stringify(state.decisions)}<br>persistence=none · writes=none`;
            wireActions();
        }
        function wireActions() {
            document.querySelectorAll("[data-decision]").forEach(button => button.addEventListener("click", () => {
                const item = reviewCases[state.currentIndex];
                state.decisions[item.id] = button.dataset.decision;
                state.challengeOpen = false;
                if (state.currentIndex < reviewCases.length - 1) state.currentIndex += 1;
                render();
            }));
            document.querySelectorAll("[data-case-index]").forEach(button => button.addEventListener("click", () => { state.currentIndex = Number(button.dataset.caseIndex); render(); }));
            document.querySelectorAll("[data-challenge]").forEach(button => button.addEventListener("click", () => {
                button.closest(".challenge").innerHTML = "Correction Search would require one explicit, bounded request for this track. No search has run.";
            }));
            document.querySelectorAll("[data-restart]").forEach(button => button.addEventListener("click", () => { state.decisions = {}; state.currentIndex = 0; render(); }));
        }
        function cycleVariant(direction) {
            const current = variants.findIndex(v => v.key === state.variant);
            state.variant = variants[(current + direction + variants.length) % variants.length].key;
            const url = new URL(location.href);
            url.searchParams.set("variant", state.variant);
            history.replaceState({}, "", url);
            render();
        }
        document.getElementById("previous-variant").addEventListener("click", () => cycleVariant(-1));
        document.getElementById("next-variant").addEventListener("click", () => cycleVariant(1));
        document.addEventListener("keydown", event => {
            if (["INPUT","TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
            if (event.key === "ArrowLeft") cycleVariant(-1);
            if (event.key === "ArrowRight") cycleVariant(1);
        });
        render();
    </script>
</body>
</html>
