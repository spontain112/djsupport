name: SQLite runtime qualification

'on':
  pull_request:
    paths:
      - ".github/workflows/sqlite-runtime.yml"
      - "djsupport/contracts/apsw-runtime-artifacts.v1.json"
      - "djsupport/contracts/apsw-runtime-artifacts.v1.schema.json"
      - "djsupport/contracts/sqlite-runtime-qualification.v1.json"
      - "djsupport/contracts/sqlite-runtime-qualification.v1.schema.json"
      - "djsupport/operational_store/**"
      - "pyproject.toml"
      - "scripts/sqlite_runtime_delivery.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sqlite-runtime.yml"
      - "djsupport/contracts/apsw-runtime-artifacts.v1.json"
      - "djsupport/contracts/apsw-runtime-artifacts.v1.schema.json"
      - "djsupport/contracts/sqlite-runtime-qualification.v1.json"
      - "djsupport/contracts/sqlite-runtime-qualification.v1.schema.json"
      - "djsupport/operational_store/**"
      - "pyproject.toml"
      - "scripts/sqlite_runtime_delivery.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.runner }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python-version: "3.10.21"
            architecture: x86_64
            setup-architecture: x64
          - runner: ubuntu-24.04
            python-version: "3.11.16"
            architecture: x86_64
            setup-architecture: x64
          - runner: ubuntu-24.04
            python-version: "3.12.14"
            architecture: x86_64
            setup-architecture: x64
          - runner: ubuntu-24.04
            python-version: "3.13.15"
            architecture: x86_64
            setup-architecture: x64
          - runner: ubuntu-24.04
            python-version: "3.14.7"
            architecture: x86_64
            setup-architecture: x64
          - runner: ubuntu-24.04-arm
            python-version: "3.10.21"
            architecture: aarch64
            setup-architecture: arm64
          - runner: ubuntu-24.04-arm
            python-version: "3.11.16"
            architecture: aarch64
            setup-architecture: arm64
          - runner: ubuntu-24.04-arm
            python-version: "3.12.14"
            architecture: aarch64
            setup-architecture: arm64
          - runner: ubuntu-24.04-arm
            python-version: "3.13.15"
            architecture: aarch64
            setup-architecture: arm64
          - runner: ubuntu-24.04-arm
            python-version: "3.14.7"
            architecture: aarch64
            setup-architecture: arm64
          - runner: macos-15-intel
            python-version: "3.10.21"
            architecture: x86_64
            setup-architecture: x64
          - runner: macos-15-intel
            python-version: "3.11.9"
            architecture: x86_64
            setup-architecture: x64
          - runner: macos-15-intel
            python-version: "3.12.10"
            architecture: x86_64
            setup-architecture: x64
          - runner: macos-15-intel
            python-version: "3.13.15"
            architecture: x86_64
            setup-architecture: x64
          - runner: macos-15-intel
            python-version: "3.14.7"
            architecture: x86_64
            setup-architecture: x64
          - runner: macos-15
            python-version: "3.10.11"
            architecture: arm64
            setup-architecture: arm64
          - runner: macos-15
            python-version: "3.11.9"
            architecture: arm64
            setup-architecture: arm64
          - runner: macos-15
            python-version: "3.12.10"
            architecture: arm64
            setup-architecture: arm64
          - runner: macos-15
            python-version: "3.13.15"
            architecture: arm64
            setup-architecture: arm64
          - runner: macos-15
            python-version: "3.14.7"
            architecture: arm64
            setup-architecture: arm64
          - runner: windows-2025
            python-version: "3.10.11"
            architecture: AMD64
            setup-architecture: x64
          - runner: windows-2025
            python-version: "3.11.9"
            architecture: AMD64
            setup-architecture: x64
          - runner: windows-2025
            python-version: "3.12.10"
            architecture: AMD64
            setup-architecture: x64
          - runner: windows-2025
            python-version: "3.13.15"
            architecture: AMD64
            setup-architecture: x64
          - runner: windows-2025
            python-version: "3.14.7"
            architecture: AMD64
            setup-architecture: x64
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.setup-architecture }}
      - name: Install pinned qualification tools
        run: python -m pip install "build==1.3.0" "pypi-attestations==0.0.30"
      - name: Collect binary provenance and loaded-runtime evidence
        env:
          DJ_SUPPORT_RUNNER_LABEL: ${{ matrix.runner }}
        run: python scripts/sqlite_runtime_delivery.py collect
