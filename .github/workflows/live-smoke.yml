name: Live Spotify smoke check

# Explicitly authorized live boundary check. It is never part of the offline
# release gate: it runs on a schedule and on manual dispatch only, uses the
# application client-credentials flow (no user account, no playlist access),
# searches for one public catalogue track, and prints no token or secret.
#
# Configure the SPOTIPY_CLIENT_ID and SPOTIPY_CLIENT_SECRET repository secrets
# from a Spotify Developer application before enabling the schedule. GitHub
# disables scheduled workflows in repositories with no activity for 60 days;
# re-enable the workflow from the Actions tab when that happens.

'on':
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Client-credentials search boundary
    if: github.repository == 'spontain112/djsupport'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the package
        run: python -m pip install --only-binary=apsw .
      - name: Probe the live Spotify search boundary
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        run: python scripts/spotify_live_smoke.py
