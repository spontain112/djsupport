[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djsupport*"]

[tool.setuptools.package-data]
djsupport = ["static/*.html", "static/*.png"]

[project]
name = "djsupport"
version = "0.5.0"
description = "Transfer Rekordbox and Beatport selections to Spotify"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.23",
    "click>=8.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
djsupport = "djsupport.cli:cli"

[project.urls]
Repository = "https://github.com/spontain112/djsupport"
Issues = "https://github.com/spontain112/djsupport/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["djsupport"]
omit = ["djsupport/cli.py"]

[tool.coverage.report]
show_missing = true
