<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>djsupport Data Model Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

  .layout { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { grid-column: 1 / -1; padding: 16px 24px; border-bottom: 1px solid #21262d; background: #161b22; }
  header h1 { font-size: 16px; font-weight: 600; color: #f0f6fc; }
  header p { font-size: 12px; color: #8b949e; margin-top: 4px; }

  .sidebar { padding: 16px; border-right: 1px solid #21262d; background: #161b22; overflow-y: auto; }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e; margin: 16px 0 8px; }
  .sidebar h3:first-child { margin-top: 0; }

  .view-btn { display: block; width: 100%; padding: 8px 12px; margin-bottom: 4px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 13px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .view-btn:hover { background: #21262d; border-color: #484f58; }
  .view-btn.active { background: #1f6feb22; border-color: #1f6feb; color: #58a6ff; }

  .scenario-btn { display: block; width: 100%; padding: 6px 10px; margin-bottom: 3px; background: transparent; border: 1px solid transparent; border-radius: 4px; color: #8b949e; font-size: 12px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .scenario-btn:hover { background: #21262d; color: #c9d1d9; }
  .scenario-btn.active { color: #f0883e; }

  .main { padding: 24px; overflow-y: auto; }

  .footer { grid-column: 1 / -1; border-top: 1px solid #21262d; background: #161b22; padding: 16px 24px; }
  .footer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .footer-header span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e; }
  .copy-btn { padding: 4px 12px; background: #21262d; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .copy-btn:hover { background: #30363d; }
  .copy-btn.copied { background: #238636; border-color: #2ea043; color: #fff; }
  #prompt { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12px; line-height: 1.5; color: #c9d1d9; max-height: 80px; overflow-y: auto; }

  /* Cards */
  .model-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .model-header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 8px; }
  .model-icon { width: 10px; height: 10px; border-radius: 50%; }
  .model-title { font-size: 14px; font-weight: 600; color: #f0f6fc; }
  .model-subtitle { font-size: 11px; color: #8b949e; margin-left: auto; }
  .model-body { padding: 16px; }

  .field-row { display: grid; grid-template-columns: 140px 100px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid #21262d; align-items: baseline; }
  .field-row:last-child { border-bottom: none; }
  .field-name { font-family: monospace; font-size: 13px; color: #79c0ff; }
  .field-type { font-family: monospace; font-size: 12px; color: #d2a8ff; }
  .field-desc { font-size: 12px; color: #8b949e; }

  .json-block { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 12px 16px; font-family: monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre; }
  .json-key { color: #79c0ff; }
  .json-str { color: #a5d6ff; }
  .json-num { color: #d2a8ff; }
  .json-bool { color: #f0883e; }
  .json-null { color: #8b949e; }
  .json-comment { color: #484f58; font-style: italic; }

  /* Flow diagram */
  .flow { display: flex; align-items: stretch; gap: 0; margin: 24px 0; flex-wrap: wrap; }
  .flow-step { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; min-width: 160px; flex: 1; }
  .flow-step.highlight { border-color: #f0883e; background: #f0883e11; }
  .flow-step h4 { font-size: 12px; color: #f0f6fc; margin-bottom: 4px; }
  .flow-step p { font-size: 11px; color: #8b949e; line-height: 1.4; }
  .flow-step code { font-size: 11px; color: #79c0ff; background: #0d1117; padding: 1px 4px; border-radius: 3px; }
  .flow-arrow { display: flex; align-items: center; padding: 0 8px; color: #484f58; font-size: 18px; }

  /* Problem highlight */
  .problem-box { background: #f8514922; border: 1px solid #f85149; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .problem-box h4 { color: #f85149; font-size: 13px; margin-bottom: 8px; }
  .problem-box p { font-size: 12px; color: #c9d1d9; line-height: 1.5; }

  .ok-box { background: #23863622; border: 1px solid #238636; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .ok-box h4 { color: #3fb950; font-size: 13px; margin-bottom: 8px; }
  .ok-box p { font-size: 12px; color: #c9d1d9; line-height: 1.5; }

  .info-box { background: #1f6feb22; border: 1px solid #1f6feb; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .info-box h4 { color: #58a6ff; font-size: 13px; margin-bottom: 8px; }
  .info-box p { font-size: 12px; color: #c9d1d9; line-height: 1.5; }

  .section-title { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-bottom: 16px; }
  .section-desc { font-size: 13px; color: #8b949e; margin-bottom: 20px; line-height: 1.5; }

  .legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b949e; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .compare-grid { grid-template-columns: 1fr; } }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .tag-key { background: #f0883e33; color: #f0883e; }
  .tag-stored { background: #23863633; color: #3fb950; }
  .tag-discarded { background: #f8514933; color: #f85149; }
  .tag-immutable { background: #1f6feb33; color: #58a6ff; }
</style>
</head>
<body>
<div class="layout">
  <header>
    <h1>djsupport Data Model Explorer</h1>
    <p>Interactive view of how playlist state, match cache, and track data flow through the system</p>
  </header>

  <div class="sidebar">
    <h3>Views</h3>
    <button class="view-btn active" onclick="showView('overview')">Data Models</button>
    <button class="view-btn" onclick="showView('state-json')">State File (JSON)</button>
    <button class="view-btn" onclick="showView('cache-json')">Cache File (JSON)</button>
    <button class="view-btn" onclick="showView('flow')">Sync Flow</button>
    <button class="view-btn" onclick="showView('lookup')">Lookup Mechanism</button>

    <h3>Scenarios</h3>
    <button class="scenario-btn active" onclick="setScenario('current')">Current (name key)</button>
    <button class="scenario-btn" onclick="setScenario('with-curator')">With curator name</button>
    <button class="scenario-btn" onclick="setScenario('resync')">Re-sync problem</button>
    <button class="scenario-btn" onclick="setScenario('url-key')">URL as key (proposed)</button>

    <h3>Source Type</h3>
    <button class="scenario-btn active" onclick="setSource('beatport')" id="src-beatport">Beatport chart</button>
    <button class="scenario-btn" onclick="setSource('label')" id="src-label">Label</button>
    <button class="scenario-btn" onclick="setSource('rekordbox')" id="src-rekordbox">Rekordbox</button>
  </div>

  <div class="main" id="main"></div>

  <div class="footer">
    <div class="footer-header">
      <span>Prompt Output</span>
      <button class="copy-btn" onclick="copyPrompt()">Copy</button>
    </div>
    <div id="prompt"></div>
  </div>
</div>

<script>
const state = {
  view: 'overview',
  scenario: 'current',
  source: 'beatport',
};

const SAMPLES = {
  beatport: {
    chartName: 'Tech House Vibes',
    curator: 'Adam Beyer',
    url: 'https://www.beatport.com/chart/tech-house-vibes/815070',
    spotifyId: 'spotify:playlist:3cEYpjA9oz9GiPac4AsH4n',
    prefix: 'djsupport',
    tracks: [
      { artist: 'Adam Beyer', title: 'Teach Me', album: 'Drumcode', duration: 412 },
      { artist: 'Amelie Lens', title: 'Higher', album: 'Lenske', duration: 378 },
    ],
  },
  label: {
    chartName: 'Drumcode',
    curator: null,
    url: 'https://www.beatport.com/label/drumcode/1/tracks',
    spotifyId: 'spotify:playlist:7kT1bJYKqfCl3UlA3RUiTy',
    prefix: 'djsupport',
    tracks: [
      { artist: 'Adam Beyer', title: 'Your Mind', album: 'Drumcode', duration: 445 },
    ],
  },
  rekordbox: {
    chartName: 'Peak - Melodic',
    curator: null,
    url: '/path/to/rekordbox.xml',
    spotifyId: 'spotify:playlist:1aBcDeFgHiJkLmNoPqRsTu',
    prefix: 'djsupport',
    tracks: [
      { artist: 'Lane 8', title: 'Brightest Lights', album: 'Brightest Lights', duration: 302 },
    ],
  },
};

function s() { return SAMPLES[state.source]; }

function composedName() {
  const d = s();
  if (state.scenario === 'with-curator' || state.scenario === 'resync' || state.scenario === 'url-key') {
    if (d.curator) return `${d.curator} - ${d.chartName}`;
  }
  return d.chartName;
}

function stateKey() {
  if (state.scenario === 'url-key') return s().url;
  return composedName();
}

function oldStateKey() { return s().chartName; }

function fullName() {
  const prefix = s().prefix;
  const name = composedName();
  return prefix ? `${prefix} / ${name}` : name;
}

function renderOverview() {
  const d = s();
  const sourceLabel = state.source === 'beatport' ? 'Beatport Chart' : state.source === 'label' ? 'Beatport Label' : 'Rekordbox XML';

  return `
    <div class="section-title">Data Models — ${sourceLabel}</div>
    <div class="section-desc">The three core data structures that persist between syncs. Click "State File" or "Cache File" to see example JSON.</div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div> Dict key</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div> Stored</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div> Discarded</div>
      <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div> Immutable ID</div>
    </div>

    <div class="model-card">
      <div class="model-header">
        <div class="model-icon" style="background:#f0883e"></div>
        <div class="model-title">PlaylistState</div>
        <div class="model-subtitle">state.py — keyed by playlist name</div>
      </div>
      <div class="model-body">
        <div class="field-row">
          <div class="field-name">[dict key]</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-key">LOOKUP KEY</span> "${esc(stateKey())}" — ${state.scenario === 'url-key' ? 'source URL (stable)' : 'raw playlist name (changes if we add curator)'}</div>
        </div>
        <div class="field-row">
          <div class="field-name">spotify_id</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-immutable">IMMUTABLE</span> "${d.spotifyId}" — the Spotify playlist URI, never changes</div>
        </div>
        <div class="field-row">
          <div class="field-name">spotify_name</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-stored">STORED</span> "${esc(fullName())}" — display name with prefix applied</div>
        </div>
        <div class="field-row">
          <div class="field-name">source_path</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-stored">STORED</span> "${esc(d.url)}" — ${state.source === 'rekordbox' ? 'XML file path' : 'Beatport URL'}</div>
        </div>
        <div class="field-row">
          <div class="field-name">last_synced</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-stored">STORED</span> ISO timestamp of last sync</div>
        </div>
        <div class="field-row">
          <div class="field-name">prefix_used</div>
          <div class="field-type">str | None</div>
          <div class="field-desc"><span class="tag tag-stored">STORED</span> "${d.prefix}" or null</div>
        </div>
        <div class="field-row">
          <div class="field-name">source_type</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-stored">STORED</span> "${state.source === 'label' ? 'label' : state.source}"</div>
        </div>
        ${state.source === 'beatport' ? `<div class="field-row">
          <div class="field-name">curator</div>
          <div class="field-type">—</div>
          <div class="field-desc"><span class="tag tag-discarded">NOT STORED</span> "${d.curator}" — extracted by beatport.py but discarded before state.set()</div>
        </div>` : ''}
      </div>
    </div>

    <div class="model-card">
      <div class="model-header">
        <div class="model-icon" style="background:#3fb950"></div>
        <div class="model-title">CacheEntry</div>
        <div class="model-subtitle">cache.py — keyed by "artist||title" (normalized)</div>
      </div>
      <div class="model-body">
        <div class="field-row">
          <div class="field-name">[dict key]</div>
          <div class="field-type">str</div>
          <div class="field-desc"><span class="tag tag-key">LOOKUP KEY</span> "${normalize(d.tracks[0].artist)}||${normalize(d.tracks[0].title)}" — artist + title, independent of playlist name</div>
        </div>
        <div class="field-row">
          <div class="field-name">spotify_uri</div>
          <div class="field-type">str | None</div>
          <div class="field-desc">Matched Spotify track URI, or null if no match</div>
        </div>
        <div class="field-row">
          <div class="field-name">spotify_name</div>
          <div class="field-type">str | None</div>
          <div class="field-desc">Spotify track name</div>
        </div>
        <div class="field-row">
          <div class="field-name">spotify_artist</div>
          <div class="field-type">str | None</div>
          <div class="field-desc">Spotify artist name</div>
        </div>
        <div class="field-row">
          <div class="field-name">score</div>
          <div class="field-type">float | None</div>
          <div class="field-desc">Fuzzy match confidence (0-100)</div>
        </div>
        <div class="field-row">
          <div class="field-name">matched</div>
          <div class="field-type">bool</div>
          <div class="field-desc">Whether a match was found</div>
        </div>
        <div class="field-row">
          <div class="field-name">threshold</div>
          <div class="field-type">int</div>
          <div class="field-desc">Threshold used during matching</div>
        </div>
        <div class="field-row">
          <div class="field-name">match_type</div>
          <div class="field-type">str | None</div>
          <div class="field-desc">Strategy that produced the match</div>
        </div>
      </div>
    </div>

    <div class="model-card">
      <div class="model-header">
        <div class="model-icon" style="background:#58a6ff"></div>
        <div class="model-title">Track</div>
        <div class="model-subtitle">rekordbox.py — shared across all sources</div>
      </div>
      <div class="model-body">
        <div class="field-row"><div class="field-name">track_id</div><div class="field-type">str</div><div class="field-desc">Source system ID</div></div>
        <div class="field-row"><div class="field-name">name</div><div class="field-type">str</div><div class="field-desc">"${d.tracks[0].title}"</div></div>
        <div class="field-row"><div class="field-name">artist</div><div class="field-type">str</div><div class="field-desc">"${d.tracks[0].artist}"</div></div>
        <div class="field-row"><div class="field-name">album</div><div class="field-type">str</div><div class="field-desc">"${d.tracks[0].album}"</div></div>
        <div class="field-row"><div class="field-name">remixer</div><div class="field-type">str</div><div class="field-desc">Remixer name</div></div>
        <div class="field-row"><div class="field-name">label</div><div class="field-type">str</div><div class="field-desc">Record label</div></div>
        <div class="field-row"><div class="field-name">genre</div><div class="field-type">str</div><div class="field-desc">Track genre</div></div>
        <div class="field-row"><div class="field-name">duration</div><div class="field-type">int</div><div class="field-desc">${d.tracks[0].duration}s</div></div>
      </div>
    </div>

    ${state.scenario === 'resync' && state.source === 'beatport' ? `
    <div class="problem-box">
      <h4>Duplication Problem</h4>
      <p>State key was <code>"${oldStateKey()}"</code> on first sync. After adding curator, the lookup uses <code>"${composedName()}"</code> — no match found in state. A <strong>new duplicate playlist</strong> is created on Spotify. The old playlist becomes orphaned.</p>
      <p style="margin-top:8px">Meanwhile, <code>spotify_id</code> ("${d.spotifyId}") is sitting right there in the state entry, perfectly capable of identifying the playlist — but we never look it up that way.</p>
    </div>` : ''}

    ${state.scenario === 'url-key' ? `
    <div class="ok-box">
      <h4>URL-keyed state avoids this entirely</h4>
      <p>If the state dict key is the source URL (<code>${esc(d.url)}</code>), it never changes regardless of how we format the display name. The <code>spotify_id</code> inside the entry tells us which Spotify playlist to update, and <code>_rename_if_needed()</code> handles renaming it.</p>
    </div>` : ''}

    <div class="info-box">
      <h4>Key insight: cache is safe, state is the problem</h4>
      <p>The match cache keys on <code>artist||title</code> (per-track), so playlist naming changes don't affect it at all. Only <code>PlaylistState</code> uses the mutable playlist name as its dict key.</p>
    </div>
  `;
}

function renderStateJson() {
  const d = s();
  const key = stateKey();
  const name = fullName();
  const now = new Date().toISOString();
  const sourceType = state.source === 'label' ? 'label' : state.source;

  let extra = '';
  if (state.scenario === 'resync' && state.source === 'beatport') {
    extra = `\n<div class="problem-box"><h4>Re-sync lookup fails</h4><p><code>state_mgr.get("${composedName()}")</code> returns <code>None</code> because the entry is keyed under <code>"${oldStateKey()}"</code>. Result: duplicate playlist created.</p></div>`;
  }

  return `
    <div class="section-title">State File (.djsupport_playlists.json)</div>
    <div class="section-desc">Persists the mapping between source playlists and Spotify playlists. Version ${state.scenario === 'url-key' ? '3 (proposed)' : '2 (current)'}.</div>
    ${extra}
    <div class="json-block">{
  <span class="json-key">"version"</span>: <span class="json-num">${state.scenario === 'url-key' ? 3 : 2}</span>,
  <span class="json-key">"entries"</span>: {
    <span class="json-key">"${esc(key)}"</span>: {  <span class="json-comment">// ${state.scenario === 'url-key' ? '← keyed by source URL (stable)' : '← keyed by playlist name (mutable!)'}</span>
      <span class="json-key">"spotify_id"</span>: <span class="json-str">"${d.spotifyId}"</span>,  <span class="json-comment">// ← immutable Spotify URI</span>
      <span class="json-key">"spotify_name"</span>: <span class="json-str">"${esc(name)}"</span>,
      <span class="json-key">"source_path"</span>: <span class="json-str">"${esc(d.url)}"</span>,  <span class="json-comment">// ← ${state.source === 'rekordbox' ? 'XML path' : 'Beatport URL (also stable!)'}</span>
      <span class="json-key">"last_synced"</span>: <span class="json-str">"${now}"</span>,
      <span class="json-key">"prefix_used"</span>: <span class="json-str">"${d.prefix}"</span>,
      <span class="json-key">"source_type"</span>: <span class="json-str">"${sourceType}"</span>
    }
  }
}</div>
  `;
}

function renderCacheJson() {
  const d = s();
  const t = d.tracks[0];
  const key = `${normalize(t.artist)}||${normalize(t.title)}`;

  return `
    <div class="section-title">Cache File (.djsupport_cache.json)</div>
    <div class="section-desc">Caches individual track match results to avoid repeated Spotify API lookups. Keyed by normalized <code>artist||title</code> — completely independent of playlist names.</div>

    <div class="ok-box">
      <h4>Not affected by playlist naming changes</h4>
      <p>Cache keys are per-track (<code>${esc(key)}</code>), not per-playlist. Changing how playlist names are composed has zero impact on the cache.</p>
    </div>

    <div class="json-block">{
  <span class="json-key">"version"</span>: <span class="json-num">1</span>,
  <span class="json-key">"entries"</span>: {
    <span class="json-key">"${esc(key)}"</span>: {  <span class="json-comment">// ← keyed by normalized artist||title</span>
      <span class="json-key">"spotify_uri"</span>: <span class="json-str">"spotify:track:4iV5W9uYEdYUVa79Axb7Rh"</span>,
      <span class="json-key">"spotify_name"</span>: <span class="json-str">"${t.title}"</span>,
      <span class="json-key">"spotify_artist"</span>: <span class="json-str">"${t.artist}"</span>,
      <span class="json-key">"score"</span>: <span class="json-num">96.5</span>,
      <span class="json-key">"matched"</span>: <span class="json-bool">true</span>,
      <span class="json-key">"timestamp"</span>: <span class="json-str">"${new Date().toISOString()}"</span>,
      <span class="json-key">"threshold"</span>: <span class="json-num">80</span>,
      <span class="json-key">"match_type"</span>: <span class="json-str">"artist_title"</span>
    },
    <span class="json-key">"${normalize(d.tracks.length > 1 ? d.tracks[1].artist : 'dj unknown')}||${normalize(d.tracks.length > 1 ? d.tracks[1].title : 'lost track')}"</span>: {
      <span class="json-key">"spotify_uri"</span>: <span class="json-null">null</span>,  <span class="json-comment">// ← no match found</span>
      <span class="json-key">"spotify_name"</span>: <span class="json-null">null</span>,
      <span class="json-key">"spotify_artist"</span>: <span class="json-null">null</span>,
      <span class="json-key">"score"</span>: <span class="json-null">null</span>,
      <span class="json-key">"matched"</span>: <span class="json-bool">false</span>,
      <span class="json-key">"timestamp"</span>: <span class="json-str">"${new Date().toISOString()}"</span>,
      <span class="json-key">"threshold"</span>: <span class="json-num">80</span>,
      <span class="json-key">"match_type"</span>: <span class="json-null">null</span>
    }
  }
}</div>
  `;
}

function renderFlow() {
  const d = s();
  const isBeatport = state.source === 'beatport';
  const isResync = state.scenario === 'resync';
  const isUrlKey = state.scenario === 'url-key';
  const hasCurator = state.scenario !== 'current';

  const curatorStep = isBeatport ? `
    <div class="flow-arrow">&#x2192;</div>
    <div class="flow-step ${hasCurator ? '' : 'highlight'}">
      <h4>${hasCurator ? 'Compose name' : 'Discard curator'}</h4>
      <p>${hasCurator
        ? `<code>"${d.curator} - ${d.chartName}"</code>`
        : `<code>_curator</code> ignored, only <code>chart_name</code> passed forward`}</p>
    </div>` : '';

  return `
    <div class="section-title">Sync Flow — ${state.source === 'beatport' ? 'Beatport Chart' : state.source === 'label' ? 'Label' : 'Rekordbox'}</div>
    <div class="section-desc">How data flows from source through to Spotify playlist creation. ${isResync ? '<strong style="color:#f85149">Red step shows where the lookup fails on re-sync.</strong>' : ''}</div>

    <div class="flow">
      <div class="flow-step">
        <h4>1. Fetch source</h4>
        <p>${isBeatport ? `<code>fetch_chart(url)</code><br>Returns: (chart_name, curator, tracks)` : state.source === 'label' ? `<code>fetch_label_tracks(url)</code><br>Returns: (label_name, tracks, count)` : `<code>parse_xml(path)</code><br>Returns: (tracks, playlists)`}</p>
      </div>
      ${curatorStep}
      <div class="flow-arrow">&#x2192;</div>
      <div class="flow-step">
        <h4>${isBeatport && !hasCurator ? '2' : isBeatport ? '3' : '2'}. Playlist name</h4>
        <p><code>"${esc(composedName())}"</code></p>
      </div>
      <div class="flow-arrow">&#x2192;</div>
      <div class="flow-step ${isResync ? 'highlight' : ''}">
        <h4>State lookup</h4>
        <p><code>state_mgr.get(${isUrlKey ? '"' + esc(d.url.substring(0,30)) + '..."' : '"' + esc(composedName()) + '"'})</code></p>
        <p style="margin-top:4px">${isResync ? '<strong style="color:#f85149">Returns None! Old key was "' + oldStateKey() + '"</strong>' : isUrlKey ? '<span style="color:#3fb950">URL never changes — always found</span>' : 'Returns PlaylistState or None'}</p>
      </div>
      <div class="flow-arrow">&#x2192;</div>
      <div class="flow-step">
        <h4>resolve_playlist_id</h4>
        <p>${isResync ? '<span style="color:#f85149">Falls through to "none" — creates new playlist</span>' : 'Uses <code>spotify_id</code> from state to verify playlist exists'}</p>
      </div>
      <div class="flow-arrow">&#x2192;</div>
      <div class="flow-step">
        <h4>Spotify API</h4>
        <p>${isResync ? '<span style="color:#f85149">Creates DUPLICATE playlist</span>' : 'Updates existing playlist tracks + renames if needed'}</p>
      </div>
    </div>

    ${isResync ? `
    <div class="problem-box">
      <h4>The root cause</h4>
      <p>The state dict key is the <strong>display name</strong> (mutable) instead of a <strong>stable identifier</strong>. The <code>spotify_id</code> and <code>source_path</code> inside the entry are both stable — but neither is used as the lookup key.</p>
      <p style="margin-top:8px"><strong>Available stable identifiers already in the entry:</strong></p>
      <p style="margin-top:4px">&#8226; <code>spotify_id</code>: "${d.spotifyId}" — immutable Spotify URI</p>
      <p>&#8226; <code>source_path</code>: "${esc(d.url)}" — the Beatport URL that uniquely identifies this chart</p>
    </div>` : ''}

    ${isUrlKey ? `
    <div class="ok-box">
      <h4>URL-keyed state solves this</h4>
      <p>With <code>source_path</code> as the dict key, the lookup always succeeds regardless of how the display name changes. The <code>spotify_name</code> field tracks what the playlist is currently called on Spotify, and <code>_rename_if_needed()</code> updates it when it changes.</p>
    </div>` : ''}
  `;
}

function renderLookup() {
  const d = s();
  const isUrlKey = state.scenario === 'url-key';
  const isResync = state.scenario === 'resync';

  return `
    <div class="section-title">Lookup Mechanism — resolve_playlist_id()</div>
    <div class="section-desc">How the system finds an existing Spotify playlist to update instead of creating a new one.</div>

    <div class="compare-grid">
      <div class="model-card">
        <div class="model-header">
          <div class="model-icon" style="background:${isUrlKey ? '#484f58' : '#f0883e'}"></div>
          <div class="model-title">Current: Name-keyed lookup</div>
        </div>
        <div class="model-body">
          <div class="json-block"><span class="json-comment">// spotify.py resolve_playlist_id()</span>

state = state_manager.<strong>get(name)</strong>
<span class="json-comment">// name = "${isResync || state.scenario === 'with-curator' ? composedName() : s().chartName}"</span>
<span class="json-comment">//</span>
<span class="json-comment">// Looks up dict key = playlist display name</span>
<span class="json-comment">// If name changes → lookup fails → duplicate</span>
${isResync ? `
<span style="color:#f85149">// State has key "${oldStateKey()}"</span>
<span style="color:#f85149">// Looking for  "${composedName()}"</span>
<span style="color:#f85149">// Result: None → creates new playlist!</span>` : ''}
</div>
          ${!isUrlKey ? `<div class="problem-box" style="margin-top:12px">
            <h4>Fragile</h4>
            <p>Any change to how playlist names are composed (adding curator, changing prefix format, etc.) breaks the lookup for all existing entries.</p>
          </div>` : ''}
        </div>
      </div>

      <div class="model-card">
        <div class="model-header">
          <div class="model-icon" style="background:${isUrlKey ? '#3fb950' : '#484f58'}"></div>
          <div class="model-title">Proposed: URL-keyed lookup</div>
        </div>
        <div class="model-body">
          <div class="json-block"><span class="json-comment">// proposed resolve_playlist_id()</span>

state = state_manager.<strong>get(source_path)</strong>
<span class="json-comment">// source_path = "${esc(d.url)}"</span>
<span class="json-comment">//</span>
<span class="json-comment">// Looks up dict key = source URL/path</span>
<span class="json-comment">// URL never changes → always found</span>
<span class="json-comment">//</span>
<span class="json-comment">// Then: _rename_if_needed() handles</span>
<span class="json-comment">// updating the Spotify playlist name</span>
${isUrlKey ? `
<span style="color:#3fb950">// Key: "${esc(d.url)}"</span>
<span style="color:#3fb950">// Always matches, regardless of display name</span>
<span style="color:#3fb950">// spotify_id inside → finds the playlist</span>` : ''}
</div>
          <div class="ok-box" style="margin-top:12px">
            <h4>Stable</h4>
            <p>Display name can change freely. The source identity (URL or file path) is the stable anchor. Already stored as <code>source_path</code> in every entry.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="info-box" style="margin-top:16px">
      <h4>Migration path</h4>
      <p>Bump state version to 3. On load, for each v2 entry, re-key from playlist name to <code>source_path</code>. The <code>source_path</code> is already stored in every entry, so no data loss. Existing <code>spotify_id</code> values are preserved — Spotify playlists remain linked.</p>
    </div>
  `;
}

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  const main = document.getElementById('main');
  switch (state.view) {
    case 'overview': main.innerHTML = renderOverview(); break;
    case 'state-json': main.innerHTML = renderStateJson(); break;
    case 'cache-json': main.innerHTML = renderCacheJson(); break;
    case 'flow': main.innerHTML = renderFlow(); break;
    case 'lookup': main.innerHTML = renderLookup(); break;
  }
  updatePrompt();
}

function updatePrompt() {
  const parts = [];
  const d = s();

  parts.push(`Currently viewing: ${state.view === 'overview' ? 'data models' : state.view === 'state-json' ? 'state JSON' : state.view === 'cache-json' ? 'cache JSON' : state.view === 'flow' ? 'sync flow' : 'lookup mechanism'} for ${state.source} source.`);

  if (state.scenario === 'current') {
    parts.push(`State uses playlist name "${d.chartName}" as dict key. spotify_id and source_path are stored but not used for lookup.`);
  } else if (state.scenario === 'with-curator') {
    parts.push(`With curator prepended, state key becomes "${composedName()}". First sync works, but existing entries keyed by "${oldStateKey()}" won't be found.`);
  } else if (state.scenario === 'resync') {
    parts.push(`RE-SYNC PROBLEM: Old state has key "${oldStateKey()}", new lookup uses "${composedName()}" — mismatch creates duplicate Spotify playlist.`);
  } else if (state.scenario === 'url-key') {
    parts.push(`With URL as key ("${d.url}"), lookup is stable regardless of display name changes. Requires state version bump to v3 with migration.`);
  }

  if (state.source === 'beatport') {
    parts.push(`Cache keys use "artist||title" and are unaffected by playlist naming.`);
  }

  document.getElementById('prompt').textContent = parts.join(' ');
}

function showView(view) {
  state.view = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setScenario(scenario) {
  state.scenario = scenario;
  document.querySelectorAll('.sidebar h3:nth-of-type(2) ~ .scenario-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setSource(source) {
  state.source = source;
  document.querySelectorAll('#src-beatport, #src-label, #src-rekordbox').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function copyPrompt() {
  const text = document.getElementById('prompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

render();
</script>
</body>
</html>
